[package]
name = "svi-keeper"
version = "0.1.0"
edition = "2021"
publish = false
description = "Permissionless keeper for the Hylo xSOL NAV feed, and a watcher for the quote it publishes"

[[bin]]
name = "svi-keeper"
path = "src/main.rs"

[dependencies]
# Same pinned SDK revision as the adapter, so keeper and program agree on the
# account set and the math by construction.
hylo-core = { git = "https://github.com/hylo-so/sdk", rev = "ee8d1cba023ae26d5e81c77ccab52a4f71c44a3f", features = ["offchain"] }
hylo-idl = { git = "https://github.com/hylo-so/sdk", rev = "ee8d1cba023ae26d5e81c77ccab52a4f71c44a3f" }
anchor-lang = "=0.32.1"
anchor-spl = "=0.32.1"
pyth-solana-receiver-sdk = "1.2.0"
solana-rpc-client = "=2.3.13"
solana-rpc-client-api = "=2.3.13"
solana-commitment-config = "=2.2.1"
solana-keypair = "=2.2.3"
solana-signer = "=2.2.1"
solana-transaction = "=2.2.3"
solana-message = "=2.4.0"
solana-sha256-hasher = "=2.3.0"
anyhow = "1"
serde_json = "1"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# Fetching signed price updates from Hermes, for symbols whose feeds are not
# sponsored on the target cluster. reqwest is already in the tree via
# solana-rpc-client; pythnet-sdk parses the accumulator blob Hermes returns and
# is the same version pyth-solana-receiver-sdk builds its params from, so the
# MerklePriceUpdate we hand it is the exact type it expects.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pythnet-sdk = "2.3.1"
base64 = "0.22"
borsh = "0.10"
# `from_slice` is generic over endianness, and Pyth's wire format is
# big-endian. The type parameter has to be named, so the crate defining it has
# to be a direct dependency.
byteorder = "1"
