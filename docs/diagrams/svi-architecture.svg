<text x="650.0" y="569.5" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" fill="#475569" text-anchor="middle">dumb, auditable, freezable · knows nothing about Hylo</text>
<text x="650.0" y="588.5" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" fill="#475569" text-anchor="middle">adapter PDA signed? · sequence++ · fresh? · lower ≤ v ≤ upper?</text>
<rect x="240" y="658" width="860" height="128" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="670.0" y="710.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">QUOTE ACCOUNT   —   320 bytes, fixed layout   —   the product</text>
<text x="670.0" y="737.5" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14.5" fill="#475569" text-anchor="middle">value + lower / upper bounds  ·  observed_slot  ·  valid_until_slot</text>
<text x="670.0" y="757.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14.5" fill="#475569" text-anchor="middle">sequence  ·  status_flags  ·  methodology_hash  ·  value_type</text>
<rect x="1155" y="658" width="280" height="128" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="1295.0" y="701.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Independent observer</text>
<text x="1295.0" y="727.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">recomputes NAV from raw</text>
<text x="1295.0" y="745.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">accounts via 2 RPCs and</text>
<text x="1295.0" y="763.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">compares, byte for byte</text>
