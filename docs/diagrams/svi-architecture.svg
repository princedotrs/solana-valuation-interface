<text x="1077.5" y="179.5" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Clock sysvar</text>
<text x="1077.5" y="205.5" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">slot · epoch</text>
<text x="1077.5" y="223.5" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">unix timestamp</text>
