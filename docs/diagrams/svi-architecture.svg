<rect width="1600" height="1010" fill="#ffffff"/>
<text x="60" y="52" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="30" font-weight="700" fill="#0f172a">Solana Valuation Interface — system architecture</text>
<text x="60" y="82" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="17" fill="#475569">The value is computed on-chain from verified accounts and written to a public account. No off-chain service is ever trusted with the arithmetic.</text>
