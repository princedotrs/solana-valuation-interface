<text x="650.0" y="365.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">svi-hylo-adapter   —   the calculator</text>
<text x="650.0" y="392.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" fill="#475569" text-anchor="middle">verify owner · PDA derivation · mint · program ID</text>
<text x="650.0" y="411.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" fill="#475569" text-anchor="middle">call hylo-core (pinned SHA) via svi-math — exact integers, no floats</text>
<text x="650.0" y="430.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14" fill="#475569" text-anchor="middle">propagate Pyth confidence into lower / upper bounds</text>
