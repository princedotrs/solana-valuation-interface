<text x="60" y="996" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="14.5" fill="#475569"><tspan font-weight="700" fill="#0f172a">Fail stale, never fail wrong.</tspan>  Any unverified input aborts the refresh — the quote ages out and consumers see the expiry. No code path publishes a value computed from unvalidated inputs.</text>
