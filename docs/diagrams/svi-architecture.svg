<text x="1295.0" y="898.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Verifiable mirror API  →  Pyth</text>
<text x="1295.0" y="924.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">ZERO arithmetic · 2 RPCs · byte-for-byte match</text>
<text x="1295.0" y="942.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">the API Pyth asked for, made safe</text>
