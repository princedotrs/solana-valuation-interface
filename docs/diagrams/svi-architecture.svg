<text x="275.0" y="924.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">Kamino · marginfi · Loopscale</text>
<text x="275.0" y="942.0" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif" font-size="13" fill="#475569" text-anchor="middle">use lower bound as collateral</text>
