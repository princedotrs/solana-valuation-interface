<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker></defs>
<rect width="1600" height="960" fill="#ffffff"/>
<text x="60" y="54" font-size="31" font-weight="700" fill="#0f172a">Where does the number come from?</text>
<text x="60" y="86" font-size="17" fill="#475569">Five places the value can change without anyone noticing — versus one, whose output anyone can reproduce from the same slot’s account data.</text>
<rect x="90" y="122" width="620" height="46" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="152" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle">TODAY — the pipeline Pyth asked Hylo to build</text>
<rect x="870" y="122" width="620" height="46" rx="9" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="1180.0" y="152" font-size="19" font-weight="700" fill="#16a34a" text-anchor="middle">WITH SVI</text>
<rect x="90" y="186" width="620" height="70" rx="9" fill="#eef1f5" stroke="#94a3b8" stroke-width="2"/>
<text x="400.0" y="218.0" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Hylo’s on-chain accounts</text>
<text x="400.0" y="240.0" font-size="14" fill="#475569" text-anchor="middle">the only real source of truth</text>
<path d="M 400.0 259 L 400.0 273" stroke="#94a3b8" stroke-width="2.4" fill="none" marker-end="url(#h)"/>
<rect x="90" y="278" width="620" height="70" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="310.0" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">One RPC provider</text>
<text x="400.0" y="332.0" font-size="14" fill="#475569" text-anchor="middle">stale or forked view goes undetected</text>
<rect x="606" y="288" width="92" height="22" rx="11" fill="#dc2626"/>
<text x="652" y="304" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">TRUSTED</text>
<path d="M 400.0 351 L 400.0 365" stroke="#94a3b8" stroke-width="2.4" fill="none" marker-end="url(#h)"/>
<rect x="90" y="370" width="620" height="70" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="402.0" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Custom off-chain parser</text>
<text x="400.0" y="424.0" font-size="14" fill="#475569" text-anchor="middle">layout drift misreads silently</text>
<rect x="606" y="380" width="92" height="22" rx="11" fill="#dc2626"/>
<text x="652" y="396" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">TRUSTED</text>
