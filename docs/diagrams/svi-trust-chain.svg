<rect x="90" y="554" width="620" height="70" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400.0" y="586.0" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Hylo-operated API</text>
<text x="400.0" y="608.0" font-size="14" fill="#475569" text-anchor="middle">server, DNS, dependency, insider</text>
<rect x="606" y="564" width="92" height="22" rx="11" fill="#dc2626"/>
<text x="652" y="580" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">TRUSTED</text>
