<text x="400.0" y="494.0" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Private calculation code</text>
<text x="400.0" y="516.0" font-size="14" fill="#475569" text-anchor="middle">nobody downstream can reproduce it</text>
<rect x="606" y="472" width="92" height="22" rx="11" fill="#dc2626"/>
<text x="652" y="488" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">TRUSTED</text>
